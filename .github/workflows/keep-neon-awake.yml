# Keep Neon awake only in the morning study window (Asia/Riyadh).
#
# Awake: 09:00–13:00 Riyadh (= 06:00–09:59 UTC)
# Sleep: 13:00–09:00 Riyadh (no pings — Neon Free can autosuspend)
#
# Ping every 4 minutes so compute does not idle past Neon's ~5 min suspend.
# Must stay well under ~100 CU-hours/month on Neon Free (~4h/day ≈ 120h worst
# case; real use is lower if the process is not always running).
#
# Fail the job when db != ok so GitHub alerts when Neon/Render DB is broken.
name: Keep Neon awake

on:
  schedule:
    - cron: "*/4 6-9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake Render + check Neon (morning window only)
        run: |
          set -euo pipefail
          BODY=$(curl -fsS --max-time 90 \
            "https://kareem-khalid-backend.onrender.com/api/health/?db=1&detail=1")
          echo "$BODY"
          echo "$BODY" | python3 -c '
import json, sys
data = json.load(sys.stdin)
db = data.get("db")
if db != "ok":
    err = data.get("db_error") or {}
    meta = data.get("database") or {}
    print("DB unhealthy:", db, file=sys.stderr)
    print("db_error:", err, file=sys.stderr)
    print("database:", meta, file=sys.stderr)
    print(
        "Fix: Neon console (suspended / CU exhausted / password) → update Render DATABASE_URL → redeploy.",
        file=sys.stderr,
    )
    sys.exit(1)
print("db ok; host=", (data.get("database") or {}).get("host"))
'
