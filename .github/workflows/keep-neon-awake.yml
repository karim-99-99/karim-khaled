# Pings the API so Neon Free does not sit idle for 5+ minutes during study hours.
# Window is 11:00–23:00 Riyadh (08:00–20:00 UTC) to stay near the 100 CU-hour Free cap.
name: Keep Neon awake

on:
  schedule:
    - cron: "*/5 8-20 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake Render + Neon
        run: |
          curl -fsS --max-time 90 \
            "https://kareem-khalid-backend.onrender.com/api/health/?db=1"
